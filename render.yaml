services:
  - type: web
    name: space-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/be/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
