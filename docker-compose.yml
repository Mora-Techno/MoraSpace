services:
  # ---------------------------------------------------------------------------
  # Nginx Load Balancer (Reverse Proxy untuk Web & API)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: spaces-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - web-1
      - web-2
    networks:
      - spaces-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend API Cluster (2 Instances)
  # ---------------------------------------------------------------------------
  api-1:
    build:
      context: .
      dockerfile: apps/be/Dockerfile
    container_name: spaces-api-1
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - apps/be/.env
    networks:
      - spaces-network
    restart: unless-stopped

  api-2:
    build:
      context: .
      dockerfile: apps/be/Dockerfile
    container_name: spaces-api-2
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - apps/be/.env
    networks:
      - spaces-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend Web Cluster (2 Instances)
  # ---------------------------------------------------------------------------
  web-1:
    build:
      context: .
      dockerfile: apps/fe/Dockerfile
    container_name: spaces-web-1
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - apps/fe/.env
    networks:
      - spaces-network
    restart: unless-stopped

  web-2:
    build:
      context: .
      dockerfile: apps/fe/Dockerfile
    container_name: spaces-web-2
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - apps/fe/.env
    networks:
      - spaces-network
    restart: unless-stopped

networks:
  spaces-network:
    driver: bridge
