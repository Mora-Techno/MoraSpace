name: MoraSpace CI/CD

on:
  push:
    branches:
      - staging
      - main
      - prod

  pull_request:
    branches:
      - staging
      - main
      - prod

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moraspace-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

jobs:
  # =========================================================
  # CI — Quality Checks
  # =========================================================
  test-and-lint:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma Schema
        run: bun --cwd apps/be prisma validate

      - name: Generate Prisma Client
        run: bun run --filter=api prisma:generate

      - name: Lint Backend
        working-directory: apps/be
        run: bun run lint

      - name: Run Backend Tests
        working-directory: apps/be
        run: bun test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST || secrets.DATABASE_URL || vars.DATABASE_URL_TEST || vars.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/mora_test' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'moraspace-ci-jwt-secret-testing-32-chars' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET || 'moraspace-internal-secret-ci' }}
          NODE_ENV: test

      - name: Build Backend
        run: bun run --filter=api build

      - name: Lint Frontend
        working-directory: apps/fe
        run: bun run lint

      - name: Build Next.js for CI
        working-directory: apps/fe
        run: bun run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

  # =========================================================
  # CD — Staging Worker (push ke branch staging)
  # =========================================================
  deploy-staging:
    name: Deploy Staging
    needs: test-and-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --filter=api prisma:generate

      - name: Run Database Migrations (Staging)
        run: |
          TARGET_URL="${DATABASE_URL:-$DIRECT_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "::warning title=Missing Database URL::DATABASE_URL / DIRECT_URL is not configured for Staging. Skipping migration."
            echo "To enable migrations, set DATABASE_URL (or DATABASE_URL_STAGING) in GitHub Secrets or Variables."
          else
            echo "Applying Prisma migrations to Staging database..."
            bun run --filter=api prisma:migrate:deploy
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL || vars.DATABASE_URL_STAGING || vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING || secrets.DIRECT_URL || vars.DIRECT_URL_STAGING || vars.DIRECT_URL }}

      - name: Build OpenNext (staging)
        working-directory: apps/fe
        run: bun run cf:build:staging
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_BASEPATH: /home
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GATE_API: ${{ vars.NEXT_PUBLIC_GATE_API }}
          NEXT_PUBLIC_VERSION_API: ${{ vars.NEXT_PUBLIC_VERSION_API }}
          NEXT_PUBLIC_INTERNAL_API_SECRET: ${{ vars.NEXT_PUBLIC_INTERNAL_API_SECRET }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL }}

          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          NEXT_INTERNAL_API_SECRET: ${{ secrets.NEXT_INTERNAL_API_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEXT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_ACCESS_KEY_ID: ${{ secrets.NEXT_ACCESS_KEY_ID }}
          NEXT_SECRET_ACCESS_KEY: ${{ secrets.NEXT_SECRET_ACCESS_KEY }}

      - name: Deploy Staging Worker
        working-directory: apps/fe
        run: bun run cf:deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEXT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo "### MoraSpace Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: moraspace-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Database Migration: Executed / Verified" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # CD — Production Worker (push ke branch main / prod)
  # =========================================================
  deploy-production:
    name: Deploy Production
    needs: test-and-lint

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --filter=api prisma:generate

      - name: Run Database Migrations (Production)
        run: |
          TARGET_URL="${DATABASE_URL:-$DIRECT_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "::warning title=Missing Database URL::DATABASE_URL / DIRECT_URL is not configured for Production. Skipping migration."
            echo "To enable migrations, set DATABASE_URL (or DATABASE_URL_PROD) in GitHub Secrets or Variables."
          else
            echo "Applying Prisma migrations to Production database..."
            bun run --filter=api prisma:migrate:deploy
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL || vars.DATABASE_URL_PROD || vars.DATABASE_URL_PRODUCTION || vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD || secrets.DIRECT_URL_PRODUCTION || secrets.DIRECT_URL || vars.DIRECT_URL_PROD || vars.DIRECT_URL_PRODUCTION || vars.DIRECT_URL }}

      - name: Build OpenNext (production)
        working-directory: apps/fe
        run: bun run cf:build:prod
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_BASEPATH: /home
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GATE_API: ${{ vars.NEXT_PUBLIC_GATE_API }}
          NEXT_PUBLIC_VERSION_API: ${{ vars.NEXT_PUBLIC_VERSION_API }}
          NEXT_PUBLIC_INTERNAL_API_SECRET: ${{ vars.NEXT_PUBLIC_INTERNAL_API_SECRET }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL }}

          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          NEXT_INTERNAL_API_SECRET: ${{ secrets.NEXT_INTERNAL_API_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEXT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_ACCESS_KEY_ID: ${{ secrets.NEXT_ACCESS_KEY_ID }}
          NEXT_SECRET_ACCESS_KEY: ${{ secrets.NEXT_SECRET_ACCESS_KEY }}

      - name: Deploy Production Worker
        working-directory: apps/fe
        run: bun run cf:deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEXT_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo "### MoraSpace Production" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: moraspace" >> "$GITHUB_STEP_SUMMARY"
          echo "Database Migration: Executed / Verified" >> "$GITHUB_STEP_SUMMARY"
