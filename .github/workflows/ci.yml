name: MoraSpace CI/CD

on:
  push:
    branches:
      - staging
      - prod

  pull_request:
    branches:
      - staging
      - prod

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moraspace-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  # =========================================================
  # CI — Quality Checks
  # =========================================================
  test-and-lint:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --filter=api prisma:generate

      - name: Run Backend Tests
        run: bun test --cwd apps/be

      - name: Build Backend
        run: bun run --filter=api build

      - name: Lint Frontend
        working-directory: apps/fe
        run: bun run lint

      - name: Build Next.js for CI
        working-directory: apps/fe
        run: bun run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

  # =========================================================
  # CD — Staging Worker (push ke branch staging)
  # =========================================================
  deploy-staging:
    name: Deploy Staging
    needs: test-and-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext (staging)
        working-directory: apps/fe
        run: bun run cf:build:staging
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://moraspace-staging.muliaandiki.workers.dev' }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api-space-v1.mora.my.id' }}
          NEXT_PUBLIC_BASEPATH: /home
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'qweqwe' }}
          NEXT_PUBLIC_GATE_API: ${{ vars.NEXT_PUBLIC_GATE_API || '/api' }}
          NEXT_PUBLIC_VERSION_API: ${{ vars.NEXT_PUBLIC_VERSION_API || '/v1' }}
          NEXT_PUBLIC_INTERNAL_API_SECRET: ${{ vars.NEXT_PUBLIC_INTERNAL_API_SECRET || secrets.NEXT_INTERNAL_API_SECRET || '7c829b0d1e2f3a4b5c6d7e8f9a0b1c2d3e4fxa6b7c8d9e0f1a2b3c4d5e6f7a8b' }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL || 'https://pub-7d1a189f820b45b79672171df36ba921.r2.dev' }}

          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          NEXT_INTERNAL_API_SECRET: ${{ secrets.NEXT_INTERNAL_API_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.NEXT_CLOUDFLARE_ACCOUNT_ID }}
          NEXT_ACCESS_KEY_ID: ${{ secrets.NEXT_ACCESS_KEY_ID }}
          NEXT_SECRET_ACCESS_KEY: ${{ secrets.NEXT_SECRET_ACCESS_KEY }}

      - name: Deploy Staging Worker
        working-directory: apps/fe
        run: bun run cf:deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.NEXT_CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || '23ad70705473f1205500a8ceb2f70f92' }}

      - name: Deployment Summary
        run: |
          echo "### MoraSpace Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: moraspace-staging" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # CD — Production Worker (push ke branch prod)
  # =========================================================
  deploy-production:
    name: Deploy Production
    needs: test-and-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext (production)
        working-directory: apps/fe
        run: bun run cf:build:prod
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://space.mora.my.id' }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api-space-v1.mora.my.id' }}
          NEXT_PUBLIC_BASEPATH: /home
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'qweqwe' }}
          NEXT_PUBLIC_GATE_API: ${{ vars.NEXT_PUBLIC_GATE_API || '/api' }}
          NEXT_PUBLIC_VERSION_API: ${{ vars.NEXT_PUBLIC_VERSION_API || '/v1' }}
          NEXT_PUBLIC_INTERNAL_API_SECRET: ${{ vars.NEXT_PUBLIC_INTERNAL_API_SECRET || secrets.NEXT_INTERNAL_API_SECRET || '7c829b0d1e2f3a4b5c6d7e8f9a0b1c2d3e4fxa6b7c8d9e0f1a2b3c4d5e6f7a8b' }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL || 'https://pub-7d1a189f820b45b79672171df36ba921.r2.dev' }}

          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          NEXT_INTERNAL_API_SECRET: ${{ secrets.NEXT_INTERNAL_API_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.NEXT_CLOUDFLARE_ACCOUNT_ID }}
          NEXT_ACCESS_KEY_ID: ${{ secrets.NEXT_ACCESS_KEY_ID }}
          NEXT_SECRET_ACCESS_KEY: ${{ secrets.NEXT_SECRET_ACCESS_KEY }}

      - name: Deploy Production Worker
        working-directory: apps/fe
        run: bun run cf:deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.NEXT_CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || '23ad70705473f1205500a8ceb2f70f92' }}

      - name: Deployment Summary
        run: |
          echo "### MoraSpace Production" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: moraspace" >> "$GITHUB_STEP_SUMMARY"
