
name: MoraSpace CI/CD

on:
  push:
    branches:
      - main
      - staging
      - develop

  pull_request:
    branches:
      - main
      - staging
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moraspace-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # =========================================================
  # CI — Quality Checks
  # =========================================================
  test-and-lint:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --filter=api prisma:generate

      - name: Run Backend Tests
        run: bun test --cwd apps/be

      - name: Build Backend
        run: bun run --filter=api build

      - name: Lint Frontend
        working-directory: apps/fe
        run: bun run lint

      - name: Build Next.js for CI
        working-directory: apps/fe
        run: bun run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: "1"

  # =========================================================
  # CD — Development & Staging Worker Previews
  # =========================================================
  deploy-preview:
    name: Deploy Preview (${{ github.ref_name }})
    needs: test-and-lint

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/staging')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'development' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext for Preview
        working-directory: apps/fe
        run: bun run cf:build
        env:
          NODE_ENV: production

          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_BASEPATH: /home
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GATE_API: ${{ vars.NEXT_PUBLIC_GATE_API }}
          NEXT_PUBLIC_VERSION_API: ${{ vars.NEXT_PUBLIC_VERSION_API }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL }}

          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          NEXT_INTERNAL_API_SECRET: ${{ secrets.NEXT_INTERNAL_API_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_ACCESS_KEY_ID: ${{ secrets.NEXT_ACCESS_KEY_ID }}
          NEXT_SECRET_ACCESS_KEY: ${{ secrets.NEXT_SECRET_ACCESS_KEY }}

      - name: Publish Worker Preview
        working-directory: apps/fe
        run: bunx wrangler preview --name "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo "### MoraSpace Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: moraspace" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # CD — Production Worker
  # =========================================================
  deploy-production:
    name: Deploy Production
    needs: test-and-lint

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext Production
        working-directory: apps/fe
        run: bun run cf:build
        env:
          NODE_ENV: production

          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_BASEPATH: /home
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GATE_API: ${{ vars.NEXT_PUBLIC_GATE_API }}
          NEXT_PUBLIC_VERSION_API: ${{ vars.NEXT_PUBLIC_VERSION_API }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL }}

          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          NEXT_INTERNAL_API_SECRET: ${{ secrets.NEXT_INTERNAL_API_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_ACCESS_KEY_ID: ${{ secrets.NEXT_ACCESS_KEY_ID }}
          NEXT_SECRET_ACCESS_KEY: ${{ secrets.NEXT_SECRET_ACCESS_KEY }}

      - name: Deploy Production Worker
        working-directory: apps/fe
        run: bunx opennextjs-cloudflare deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo "### MoraSpace Production" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: moraspace" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://moraspace.muliaandiki.workers.dev" >> "$GITHUB_STEP_SUMMARY"
